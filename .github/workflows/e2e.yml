name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-e2e
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (single job)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      CIRCUITS_RELEASE: v0.11.2

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Init submodules (HTTPS via token)
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth=1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache cargo (backend)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/backend

      - name: Fetch circuit artifacts
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          mkdir -p vendor/circuits/build/4x4_js vendor/circuits/build/tree_update_batch_js
          gh release download "$CIRCUITS_RELEASE" \
            --repo lelantos-org/circuits \
            --pattern '4x4.wasm' \
            --pattern '4x4.r1cs' \
            --pattern '4x4_final.zkey' \
            --pattern 'tree_update_batch.wasm' \
            --pattern 'tree_update_batch.r1cs' \
            --pattern 'tree_update_batch_final.zkey' \
            --dir vendor/circuits/build
          mv vendor/circuits/build/4x4.wasm vendor/circuits/build/4x4_js/4x4.wasm
          mv vendor/circuits/build/tree_update_batch.wasm vendor/circuits/build/tree_update_batch_js/tree_update_batch.wasm

      - name: Verify circuit artifacts
        run: |
          test -f vendor/circuits/build/4x4_final.zkey
          test -f vendor/circuits/build/4x4.r1cs
          test -f vendor/circuits/build/4x4_js/4x4.wasm
          test -f vendor/circuits/build/tree_update_batch_final.zkey
          test -f vendor/circuits/build/tree_update_batch_js/tree_update_batch.wasm
          test -f vendor/circuits/build/tree_update_batch.r1cs

      - name: Compute zkey content hashes
        id: zkey-hashes
        run: |
          set -euo pipefail
          tree_sha=$(sha256sum vendor/circuits/build/tree_update_batch_final.zkey | cut -d' ' -f1)
          pair_sha=$(sha256sum vendor/circuits/build/4x4_final.zkey | cut -d' ' -f1)
          echo "tree_zkey_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "pair_zkey_sha=$pair_sha" >> "$GITHUB_OUTPUT"
          echo "tree_update_batch_final.zkey = $tree_sha"
          echo "4x4_final.zkey               = $pair_sha"

      - name: Verify vkeys match committed verifier sols
        run: |
          set -uo pipefail

          # `uint256 constant <name> = <value>;` pairs — the vkey itself. The
          # rest of the file is snarkjs boilerplate, identical across patch
          # versions, and the `contract <Name> {` line differs by design
          # because the committed contracts are renamed.
          consts() {
            sed -nE 's/^[[:space:]]*uint256 constant ([A-Za-z0-9_]+)[[:space:]]*=[[:space:]]*([0-9]+);.*/\1 \2/p' "$1"
          }

          # Names whose values differ, or that the committed sol adds. Which
          # constants differ is the diagnosis: `delta*` and `IC*` alone mean a
          # different phase-2 contribution, a changed `IC*` count means a
          # different circuit. The values are 77-digit numbers and say nothing
          # in a log.
          mismatched() {
            awk 'NR==FNR { a[$1] = $2; next }
                 { if (!($1 in a) || a[$1] != $2) print $1 }' <(consts "$1") <(consts "$2")
          }

          check() {
            local zkey=$1 sol=$2 label=$3
            # Per-label output file, and the export is checked: on failure a
            # shared or stale file would be compared instead, reporting a vkey
            # mismatch for what is really a missing or corrupt zkey.
            local gen=/tmp/verifier-$label.sol
            if ! npx --yes snarkjs@0.7.5 zkey export solidityverifier "$zkey" "$gen" >/dev/null; then
              echo "::error::$label: could not export a verifier from $zkey"
              return 1
            fi
            local bad
            bad=$(mismatched "$gen" "$sol")
            if [ -z "$bad" ]; then
              echo "$label: vkey matches $(basename "$sol")"
              return 0
            fi
            echo "::error::$label: $sol vkey != $(basename "$zkey") vkey"
            echo "  differing constants: $(echo "$bad" | tr '\n' ' ')"
            return 1
          }

          # Both are checked before failing, so one run reports every mismatch.
          rc=0
          check vendor/circuits/build/tree_update_batch_final.zkey \
                vendor/contracts/src/verifiers/TreeUpdateBatchVerifier.sol tree_update_batch || rc=1
          check vendor/circuits/build/4x4_final.zkey \
                vendor/contracts/src/verifiers/Verifier.sol 4x4 || rc=1
          exit $rc

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Resolve submodule SHAs once; use as per-image cache keys.
      - name: Resolve submodule SHAs
        id: shas
        run: |
          echo "backend=$(git -C vendor/backend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "circuits=$(git -C vendor/circuits rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "be_dockerfile=$(sha256sum vendor/backend/Dockerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "rl_dockerfile=$(sha256sum vendor/backend/crates/relayer/Dockerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache image — ingester
        id: cache-ingester
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/ingester.tar
          key: img-ingester-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Cache image — fmd-indexer
        id: cache-fmd-indexer
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/fmd-indexer.tar
          key: img-fmd-indexer-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Cache image — explorer-indexer
        id: cache-explorer-indexer
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/explorer-indexer.tar
          key: img-explorer-indexer-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Cache image — fmd-webserver
        id: cache-fmd-webserver
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/fmd-webserver.tar
          key: img-fmd-webserver-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Cache image — explorer-webserver
        id: cache-explorer-webserver
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/explorer-webserver.tar
          key: img-explorer-webserver-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Cache image — relayer
        id: cache-relayer
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/relayer.tar
          key: img-relayer-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.zkey-hashes.outputs.tree_zkey_sha }}-${{ steps.zkey-hashes.outputs.pair_zkey_sha }}-${{ steps.shas.outputs.rl_dockerfile }}

      - name: Cache image — metaquoter
        id: cache-metaquoter
        uses: actions/cache/restore@v4
        with:
          path: /tmp/docker-images/metaquoter.tar
          key: img-metaquoter-${{ runner.os }}-${{ steps.shas.outputs.backend }}-${{ steps.shas.outputs.be_dockerfile }}

      - name: Build / load images
        env:
          HIT_INGESTER: ${{ steps.cache-ingester.outputs.cache-hit }}
          HIT_FMD_INDEXER: ${{ steps.cache-fmd-indexer.outputs.cache-hit }}
          HIT_EXPLORER_INDEXER: ${{ steps.cache-explorer-indexer.outputs.cache-hit }}
          HIT_FMD_WEBSERVER: ${{ steps.cache-fmd-webserver.outputs.cache-hit }}
          HIT_EXPLORER_WEBSERVER: ${{ steps.cache-explorer-webserver.outputs.cache-hit }}
          HIT_RELAYER: ${{ steps.cache-relayer.outputs.cache-hit }}
          HIT_METAQUOTER: ${{ steps.cache-metaquoter.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-images

          load_or_build() {
            local pkg="$1" hit="$2" df="$3" ctx="$4"
            local tar="/tmp/docker-images/${pkg}.tar"
            if [[ "$hit" == "true" ]]; then
              echo "==> Loading cached lelantos/$pkg:dev"
              docker load -i "$tar"
              return
            fi
            echo "==> Building lelantos/$pkg:dev"
            local build_args=()
            if [[ "$df" == "vendor/backend/Dockerfile" ]]; then
              build_args=(--build-arg "PACKAGE=$pkg")
            fi
            docker buildx build --load \
              "${build_args[@]}" \
              -f "$df" \
              -t "lelantos/$pkg:dev" \
              --cache-from "type=gha,scope=$pkg" \
              --cache-to   "type=gha,scope=$pkg,mode=max" \
              "$ctx"
            docker save "lelantos/$pkg:dev" -o "$tar"
          }

          # Backend-only services in parallel.
          pids=()
          load_or_build ingester           "$HIT_INGESTER"           vendor/backend/Dockerfile vendor/backend & pids+=($!)
          load_or_build fmd-indexer        "$HIT_FMD_INDEXER"        vendor/backend/Dockerfile vendor/backend & pids+=($!)
          load_or_build explorer-indexer   "$HIT_EXPLORER_INDEXER"   vendor/backend/Dockerfile vendor/backend & pids+=($!)
          load_or_build fmd-webserver      "$HIT_FMD_WEBSERVER"      vendor/backend/Dockerfile vendor/backend & pids+=($!)
          load_or_build explorer-webserver "$HIT_EXPLORER_WEBSERVER" vendor/backend/Dockerfile vendor/backend & pids+=($!)
          load_or_build metaquoter         "$HIT_METAQUOTER"         vendor/backend/Dockerfile vendor/backend & pids+=($!)
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          [[ $fail -eq 0 ]]

          # Relayer (different Dockerfile + context).
          load_or_build relayer "$HIT_RELAYER" vendor/backend/crates/relayer/Dockerfile vendor

      - name: Save image cache — ingester
        if: steps.cache-ingester.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/ingester.tar
          key: ${{ steps.cache-ingester.outputs.cache-primary-key }}

      - name: Save image cache — fmd-indexer
        if: steps.cache-fmd-indexer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/fmd-indexer.tar
          key: ${{ steps.cache-fmd-indexer.outputs.cache-primary-key }}

      - name: Save image cache — explorer-indexer
        if: steps.cache-explorer-indexer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/explorer-indexer.tar
          key: ${{ steps.cache-explorer-indexer.outputs.cache-primary-key }}

      - name: Save image cache — fmd-webserver
        if: steps.cache-fmd-webserver.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/fmd-webserver.tar
          key: ${{ steps.cache-fmd-webserver.outputs.cache-primary-key }}

      - name: Save image cache — metaquoter
        if: steps.cache-metaquoter.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/metaquoter.tar
          key: ${{ steps.cache-metaquoter.outputs.cache-primary-key }}

      - name: Save image cache — explorer-webserver
        if: steps.cache-explorer-webserver.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/explorer-webserver.tar
          key: ${{ steps.cache-explorer-webserver.outputs.cache-primary-key }}

      - name: Save image cache — relayer
        if: steps.cache-relayer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/docker-images/relayer.tar
          key: ${{ steps.cache-relayer.outputs.cache-primary-key }}

      - name: Verify image tags
        run: |
          for img in ingester fmd-indexer explorer-indexer fmd-webserver explorer-webserver relayer metaquoter; do
            docker image inspect lelantos/$img:dev >/dev/null
          done

      - name: Install e2e deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run e2e
        env:
          E2E_LOG_DIR: /tmp/e2e-logs
        run: npm test

      - name: Collect leftover container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          docker ps -a > /tmp/e2e-logs/ps.txt 2>&1 || true
          for cid in $(docker ps -aq); do
            name=$(docker inspect --format='{{.Name}}' "$cid" | sed 's|^/||')
            docker logs "$cid" > "/tmp/e2e-logs/leaked-${name}.log" 2>&1 || true
          done

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-container-logs
          path: /tmp/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
