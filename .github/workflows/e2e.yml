name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-e2e
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The eight backend images the stack runs (`src/services.ts`), tagged
  # `lelantos/<name>:dev` as the suite expects.
  BACKEND_IMAGES: ingester fmd-indexer explorer-indexer protocol-indexer fmd-webserver explorer-webserver relayer metaquoter
  # Where the backend repository's Docker workflow publishes them, one tag per
  # image and commit: `<name>-sha-<short sha>`.
  BACKEND_REGISTRY: ghcr.io/lelantos-org/backend
  IMAGES_TAR: /tmp/backend-images.tar

jobs:
  # Produces the backend images once per `vendor/backend` commit and caches them
  # as one tar, which every test shard restores. In order of preference: the
  # tar is already cached (nothing to do), the backend's own CI published the
  # images for this commit (pull, seconds), or neither (build, the slow path).
  images:
    name: Backend images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      key: ${{ steps.key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Init backend submodule (HTTPS via token)
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 vendor/backend

      - name: Cache key
        id: key
        run: |
          set -euo pipefail
          sha=$(git -C vendor/backend rev-parse HEAD)
          be_df=$(sha256sum vendor/backend/Dockerfile | cut -c1-12)
          rl_df=$(sha256sum vendor/backend/crates/relayer/Dockerfile | cut -c1-12)
          {
            echo "sha=$sha"
            echo "short=$(git -C vendor/backend rev-parse --short=7 HEAD)"
            echo "key=backend-images-v2-${{ runner.os }}-${sha}-${be_df}-${rl_df}"
          } >> "$GITHUB_OUTPUT"

      - name: Look up cached images
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.IMAGES_TAR }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Pull images published by the backend CI
        id: pull
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          SHORT: ${{ steps.key.outputs.short }}
        run: |
          set -uo pipefail
          missing=()
          if ! echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; then
            echo "::warning::could not log in to ghcr.io; building every image"
            read -ra missing <<< "$BACKEND_IMAGES"
          else
            for img in $BACKEND_IMAGES; do
              ref="$BACKEND_REGISTRY:$img-sha-$SHORT"
              if docker pull --quiet "$ref"; then
                docker tag "$ref" "lelantos/$img:dev"
              else
                echo "::notice::$ref not published; will build it"
                missing+=("$img")
              fi
            done
          fi
          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true' && steps.pull.outputs.missing != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Docker buildx
        if: steps.cache.outputs.cache-hit != 'true' && steps.pull.outputs.missing != ''
        uses: docker/setup-buildx-action@v3

      - name: Build unpublished images
        if: steps.cache.outputs.cache-hit != 'true' && steps.pull.outputs.missing != ''
        env:
          MISSING: ${{ steps.pull.outputs.missing }}
        run: |
          set -euo pipefail
          build() {
            local pkg="$1" df ctx args=()
            if [[ "$pkg" == relayer ]]; then
              # Context `vendor/`, though the Dockerfile copies only `backend/`:
              # circuits are mounted into the container at run time.
              df=vendor/backend/crates/relayer/Dockerfile; ctx=vendor
            else
              df=vendor/backend/Dockerfile; ctx=vendor/backend; args=(--build-arg "PACKAGE=$pkg")
            fi
            echo "==> Building lelantos/$pkg:dev"
            docker buildx build --load "${args[@]}" -f "$df" -t "lelantos/$pkg:dev" \
              --cache-from "type=gha,scope=$pkg" --cache-to "type=gha,scope=$pkg,mode=max" "$ctx"
          }
          pids=()
          for pkg in $MISSING; do build "$pkg" & pids+=($!); done
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          [[ $fail -eq 0 ]]

      - name: Save images
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          refs=()
          for img in $BACKEND_IMAGES; do
            docker image inspect "lelantos/$img:dev" > /dev/null
            refs+=("lelantos/$img:dev")
          done
          # One tar: the images share base layers, which `docker save` stores once.
          docker save "${refs[@]}" -o "$IMAGES_TAR"
          ls -lh "$IMAGES_TAR"

      - name: Cache images
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.IMAGES_TAR }}
          key: ${{ steps.key.outputs.key }}

  # The suite split across parallel jobs, each with its own stack. Files are
  # packed by measured duration (`scripts/ci-shard.mjs`, `ci/test-timings.json`).
  test:
    name: E2E shard ${{ matrix.shard }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # The only place the shard count is set: `ci-shard.mjs` is given
        # `strategy.job-total`.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      # Only the contracts: forge deploys them from `vendor/contracts`. The
      # images come prebuilt and the circuits from their GitHub release.
      - name: Init contracts submodule (HTTPS via token)
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth=1 vendor/contracts

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Restore images
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.IMAGES_TAR }}
          key: ${{ needs.images.outputs.key }}
          fail-on-cache-miss: true

      - name: Load images
        run: |
          set -euo pipefail
          docker load -i "$IMAGES_TAR"
          rm -f "$IMAGES_TAR"
          for img in $BACKEND_IMAGES; do docker image inspect "lelantos/$img:dev" > /dev/null; done
          df -h /

      - name: Install e2e deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: npm ci

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Run e2e shard
        # Below the job's 45 minutes: a step timeout is a failure, so the log
        # steps below still run and upload what the stack was doing.
        timeout-minutes: 38
        env:
          E2E_LOG_DIR: /tmp/e2e-logs
          E2E_JUNIT_FILE: test-results-${{ matrix.shard }}.xml
          # `scripts/fetch-circuits.sh` downloads the relayer's artifacts at boot.
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
        run: |
          set -euo pipefail
          read -ra files <<< "$(node scripts/ci-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }})"
          printf '%s\n' "${files[@]}"
          npx vitest run "${files[@]}"

      - name: Collect leftover container state on failure
        if: failure() || cancelled()
        run: |
          mkdir -p /tmp/e2e-logs
          docker ps -a > /tmp/e2e-logs/ps.txt 2>&1 || true
          for cid in $(docker ps -aq); do
            name=$(docker inspect --format='{{.Name}}' "$cid" | sed 's|^/||')
            docker logs "$cid" > "/tmp/e2e-logs/leaked-${name}.log" 2>&1 || true
          done

      - name: Upload logs artifact
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-container-logs-shard-${{ matrix.shard }}
          path: /tmp/e2e-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: test-results-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  # One status for branch protection, under the name the single-job workflow
  # used, so an existing required check keeps matching.
  e2e:
    name: E2E (single job)
    needs: [images, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        env:
          IMAGES: ${{ needs.images.result }}
          SHARDS_RESULT: ${{ needs.test.result }}
        run: |
          echo "images: $IMAGES, shards: $SHARDS_RESULT"
          test "$IMAGES" = success
          test "$SHARDS_RESULT" = success
