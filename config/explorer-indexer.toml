# Explorer indexer config. Mounted at /etc/explorer-indexer.toml in the
# container.
#
# Flow analytics only — `asset_flows`, `yield_fee_events` and the materialized
# views over them. It reads no chain: everything needing an RPC, and every
# table the wallet or the relayer depends on, belongs to protocol-indexer.
# There is deliberately no [[chains]] block here.
#
# Fields below are the complete set (see ExplorerIndexerConfig).

database_url = "postgres://postgres:postgres@postgres:5432/postgres"

# Tight so the indexer keeps up with anvil's 1s blocks.
tick_ms = 500
batch = 500
