# MetaQuoter config for the e2e harness. Mounted at /etc/metaquoter.toml.
# Container env (set by services.ts) overrides every per-chain field at runtime;
# the TOML defaults exist only so the binary can boot without env.

listen_addr = "0.0.0.0:8081"
race_deadline_ms = 1500

[[chains]]
chain_id = 31337
rpc_url = "http://anvil:8545"
# Overridden by METAQUOTER_CHAIN_31337_UNIV3_QUOTER (set by stack.ts).
univ3_quoter = "0x0000000000000000000000000000000000000000"
# Overridden by METAQUOTER_CHAIN_31337_UNIV3_ADAPTER (set by stack.ts).
univ3_adapter = "0x0000000000000000000000000000000000000000"
# Overridden by METAQUOTER_CHAIN_31337_UNIV4_ADAPTER (set by stack.ts).
univ4_quoter = "0x0000000000000000000000000000000000000000"
univ4_adapter = "0x0000000000000000000000000000000000000000"
# Mirrors FEE_BPS in src/protocol/amounts.ts; overridden by env.
masp_fee_bps = 0
